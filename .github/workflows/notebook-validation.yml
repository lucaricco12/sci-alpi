name: Notebook validation

on:
  pull_request:
    branches: [main]
    paths:
      - "notebooks/02.2_scraping.ipynb"
      - "notebooks/02.3_features_spatial.ipynb"
      - "scripts/validate_notebooks.py"
      - ".github/workflows/notebook-validation.yml"
  push:
    branches: ["lorenzo/data-quality-280-resorts"]
    paths:
      - "notebooks/02.2_scraping.ipynb"
      - "notebooks/02.3_features_spatial.ipynb"
      - "scripts/validate_notebooks.py"
      - ".github/workflows/notebook-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install parser dependencies
        run: python -m pip install --upgrade pip numpy pandas requests beautifulsoup4
      - name: Validate notebooks and parser
        run: python scripts/validate_notebooks.py
