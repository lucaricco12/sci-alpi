name: Run resort data pipeline

on:
  push:
    branches: ["lorenzo/data-quality-280-resorts"]
    paths:
      - ".github/workflows/run-data-pipeline.yml"
      - "notebooks/02.2_scraping.ipynb"
      - "notebooks/02.3_features_spatial.ipynb"
  workflow_dispatch:
concurrency:
  group: ski-resort-data-pipeline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install notebook runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas requests beautifulsoup4 matplotlib jupyter nbconvert ipykernel
      - name: Execute 02.2 scraping
        run: jupyter nbconvert --to notebook --execute --inplace --ExecutePreprocessor.timeout=1800 notebooks/02.2_scraping.ipynb
      - name: Execute 02.3 spatial features and EDA
        run: jupyter nbconvert --to notebook --execute --inplace --ExecutePreprocessor.timeout=1800 notebooks/02.3_features_spatial.ipynb
      - name: Commit generated processed datasets to this branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/resorts_scrape_candidates.csv
          git add data/processed/resorts_clean.csv
          git add data/processed/resorts_features.csv
          git add data/processed/resorts_geocoded_cache.csv
          git add data/processed/hotels_cache.csv
          git add data/processed/resorts_feature_coverage.csv
          git add data/processed/overpass_batch_log.csv
          if git diff --cached --quiet; then
            echo "No processed dataset changes to commit."
          else
            git commit -m "Refresh 280-resort scraping and spatial datasets"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Upload generated datasets and executed notebooks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ski-resort-pipeline-results
          path: |
            data/processed/resorts_scrape_candidates.csv
            data/processed/resorts_clean.csv
            data/processed/resorts_features.csv
            data/processed/resorts_geocoded_cache.csv
            data/processed/hotels_cache.csv
            data/processed/resorts_feature_coverage.csv
            data/processed/overpass_batch_log.csv
            notebooks/02.2_scraping.ipynb
            notebooks/02.3_features_spatial.ipynb
          if-no-files-found: warn
          retention-days: 7
